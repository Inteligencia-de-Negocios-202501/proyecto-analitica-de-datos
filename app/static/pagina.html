<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center text-primary">📰 Fake News Detector</h1>
        <p class="lead text-center">Detecta si una noticia es <strong>falsa</strong> o <strong>real</strong> utilizando IA.</p>

        <!-- Sección de predicción -->
        <div class="card bg-light shadow-sm p-4 mt-4">
            <h3 class="text-primary">🤔 Realizar Predicciones</h3>
            <form id="predictionForm">
                <div class="mb-3">
                    <label for="title" class="form-label">Título de la noticia</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="Ingrese el título..." required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Descripción de la noticia</label>
                    <textarea class="form-control" id="description" name="description" rows="4"
                        placeholder="Ingrese la descripción..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">🔍 Predecir</button>
            </form>
            <div id="predictionResult" class="alert mt-3" style="display: none;"></div>
        </div>

        <!-- Sección de predicción masiva desde CSV -->
        <div class="card bg-white shadow-sm p-4 mt-5">
            <h3 class="text-warning">📂 Predicción Masiva desde CSV</h3>
            <form id="predictCsvForm">
                <div class="mb-3">
                    <label for="csvFile" class="form-label">Seleccionar archivo CSV (.csv)</label>
                    <input type="file" class="form-control" id="csvFile" name="file" accept=".csv" required>
                </div>
                <button type="submit" class="btn btn-warning">📊 Predecir desde CSV</button>
            </form>
            <div id="csvResult" class="mt-3" style="display: none;">
                <h5 class="text-success">✅ Resultados:</h5>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Título</th>
                                <th>Descripción</th>
                                <th>Predicción</th>
                                <th>Probabilidad Real (%)</th>
                                <th>Probabilidad Falsa (%)</th>
                            </tr>
                        </thead>
                        <tbody id="csvResultBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Sección de reentrenamiento -->
        <div class="card bg-white shadow-sm p-4 mt-5">
            <h3 class="text-success">📚 Reentrenar el Modelo</h3>
            <form id="retrainForm">
                <div class="mb-3">
                    <label for="retrainFile" class="form-label">Seleccionar archivo CSV para reentrenamiento (.csv)</label>
                    <input type="file" class="form-control" id="retrainFile" name="file" accept=".csv" required>
                </div>
                <button type="submit" class="btn btn-success">📈 Reentrenar</button>
            </form>
            <div id="retrainResult" class="alert mt-3" style="display: none;"></div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS para manejar formularios -->
    <script>
        // Manejador del formulario de predicción
        document.getElementById("predictionForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const title = document.getElementById("title").value;
            const description = document.getElementById("description").value;

            const response = await fetch("/predict/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify([
                    {
                        Titulo: title,
                        Descripcion: description
                    }
                ])
            });

            const result = await response.json();
            const predictionResult = document.getElementById("predictionResult");

            if (response.ok) {
                predictionResult.innerHTML = `
                    ✅ Predicción: <strong>${result[0].Prediccion}</strong><br>
                    🎯 Probabilidad: ${(result[0].Probabilidad[1] * 100).toFixed(2)}%
                `;
                predictionResult.className = "alert alert-success";
            } else {
                predictionResult.innerHTML = `❌ Error: ${result.detail || "Error al procesar la predicción"}`;
                predictionResult.className = "alert alert-danger";
            }
            predictionResult.style.display = "block";
        });

        // Manejador del formulario de predicción desde CSV
        document.getElementById("predictCsvForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const fileInput = document.getElementById("csvFile");
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const response = await fetch("/predict_csv/", {
                method: "POST",
                body: formData
            });

            const result = await response.json();
            const csvResult = document.getElementById("csvResult");
            const csvResultBody = document.getElementById("csvResultBody");

            if (response.ok) {
                csvResultBody.innerHTML = result.predicciones.map(item => `
                    <tr>
                        <td>${item.Titulo}</td>
                        <td>${item.Descripcion}</td>
                        <td><strong>${item.Prediccion}</strong></td>
                        <td>${(item.Probabilidad.Real * 100).toFixed(2)}%</td>
                        <td>${(item.Probabilidad.Falsa * 100).toFixed(2)}%</td>
                    </tr>
                `).join('');
                csvResult.style.display = "block";
            } else {
                csvResult.innerHTML = `❌ Error: ${result.detail || "Error al procesar el archivo CSV"}`;
                csvResult.className = "alert alert-danger";
                csvResult.style.display = "block";
            }
        });

        // Manejador del formulario de reentrenamiento
        document.getElementById("retrainForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const fileInput = document.getElementById("retrainFile");
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const response = await fetch("/retrain/", {
                method: "POST",
                body: formData
            });

            const result = await response.json();
            const retrainResult = document.getElementById("retrainResult");

            if (response.ok) {
                retrainResult.innerHTML = `
                    ✅ ¡Reentrenamiento exitoso!<br>
                    🎯 Precisión: ${(result.metrics['weighted avg']['precision'] * 100).toFixed(2)}%<br>
                    📚 Recall: ${(result.metrics['weighted avg']['recall'] * 100).toFixed(2)}%<br>
                    🔥 F1 Score: ${(result.metrics['weighted avg']['f1-score'] * 100).toFixed(2)}%
                `;
                retrainResult.className = "alert alert-success";
            } else {
                retrainResult.innerHTML = `❌ Error: ${result.detail || "Error al procesar el reentrenamiento"}`;
                retrainResult.className = "alert alert-danger";
            }
            retrainResult.style.display = "block";
        });

    </script>
</body>

</html>
